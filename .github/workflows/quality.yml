name: Quality checks

on:
    push:
        branches: [master]
        paths:
            - "**/*.go"
            - "templates/**"
            - "go.mod"
            - "go.sum"
            - "Makefile"
            - ".github/workflows/quality.yml"
            - ".golangci.yml"
    pull_request:
        branches: [master]
        paths:
            - "**/*.go"
            - "templates/**"
            - "go.mod"
            - "go.sum"
            - "Makefile"
            - ".github/workflows/quality.yml"
            - ".golangci.yml"

permissions:
    contents: read
    actions: write
    pull-requests: write

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        concurrency:
            group: coverage-comment-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: false

        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
                  cache-dependency-path: go.sum

            - name: Run tests with coverage
              run: make cover

            - name: Coverage report
              # Release PRs only bump the version and the changelog.
              if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--')
              uses: xseman/coverage@v0.4.0
              with:
                  update-comment-marker: "<!-- coverage-reporter-openapi-generator -->"
                  coverage-artifact-paths: go:coverage.out

    lint:
        name: Lint
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
                  cache-dependency-path: go.sum

            - run: make lint

    build:
        name: Build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
                  cache-dependency-path: go.sum

            - name: Build binary
              run: make build
