spec: ../../specs/feature/discriminator-allof-no-mapping.yaml
skip:
  go-fetch: "a discriminator without oneOf: the parent stays a plain struct, the children's properties are dropped"
  dart-fetch: "does not compile: lib/src/apis/default_api.dart:71: Expected an identifier."
cases:
  - name: children by their schema names
    op: listPets
    response: { json: [{ petType: Cat, name: tom, born: "2024-01-02T03:04:05Z", nick-name: tommy }, { petType: Dog, pack-size: 3 }] }
    result: [{ petType: Cat, name: tom, born: "2024-01-02T03:04:05Z", nick-name: tommy }, { petType: Dog, pack-size: 3 }]
  - name: a child as the parent's body
    op: addPet
    args: { body: { petType: Cat, born: "2024-01-02T03:04:05Z", nick-name: tommy } }
    request: { body: { petType: Cat, born: "2024-01-02T03:04:05Z", nick-name: tommy } }
    response: { status: 204 }
