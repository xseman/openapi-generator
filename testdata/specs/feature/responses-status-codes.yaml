openapi: "3.0.0"
info:
  title: Multiple Status Codes and No-Content Responses Feature
  version: 1.0.0
paths:
  /tasks/{id}:
    get:
      operationId: getTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    delete:
      operationId: deleteTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: deleted, no content
    post:
      operationId: createTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "202":
          description: accepted
components:
  schemas:
    Task:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
    ErrorBody:
      type: object
      properties:
        message:
          type: string
        code:
          type: integer
