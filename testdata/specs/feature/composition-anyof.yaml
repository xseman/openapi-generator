openapi: "3.0.0"
info:
  title: AnyOf Composition Feature
  version: 1.0.0
paths:
  /contacts:
    post:
      operationId: createContact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMethod"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMethod"
components:
  schemas:
    ContactMethod:
      anyOf:
        - $ref: "#/components/schemas/EmailContact"
        - $ref: "#/components/schemas/PhoneContact"
    EmailContact:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    PhoneContact:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
