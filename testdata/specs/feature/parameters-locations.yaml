openapi: "3.0.0"
info:
  title: Parameter Locations Feature
  version: 1.0.0
paths:
  /orgs/{orgId}/items/{itemId}:
    get:
      operationId: getItem
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
        - name: verbose
          in: query
          required: false
          schema:
            type: boolean
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
        - name: sessionId
          in: cookie
          required: false
          schema:
            type: string
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
