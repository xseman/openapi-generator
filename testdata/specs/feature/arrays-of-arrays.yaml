openapi: "3.0.0"
info:
  title: Arrays of Arrays Feature
  version: 1.0.0
paths:
  /matrix:
    get:
      operationId: getMatrix
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Matrix"
  /grid:
    get:
      operationId: getGrid
      responses:
        "200":
          description: rows of cells
          content:
            application/json:
              schema:
                type: array
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/Cell"
components:
  schemas:
    Matrix:
      type: object
      properties:
        grid:
          type: array
          items:
            type: array
            items:
              type: number
        cube:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: integer
        rowsOfModels:
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/Cell"
    Cell:
      type: object
      properties:
        value:
          type: number
        cell-name:
          type: string
        seenAt:
          type: string
          format: date-time
