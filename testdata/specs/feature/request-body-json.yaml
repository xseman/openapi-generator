openapi: "3.0.0"
info:
  title: JSON Request Body Feature
  version: 1.0.0
paths:
  /items:
    post:
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Item"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
  /items/bulk:
    post:
      operationId: createItems
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Item"
      responses:
        "200":
          description: ok
  /items/raw-count:
    post:
      operationId: setRawCount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: integer
      responses:
        "200":
          description: ok
components:
  schemas:
    Item:
      type: object
      required: [name]
      properties:
        name:
          type: string
        quantity:
          type: integer
