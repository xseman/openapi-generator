openapi: "3.0.0"
info:
  title: JSON Request Body Feature
  version: 1.0.0
paths:
  /items:
    post:
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Item"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
  /items/bulk:
    post:
      operationId: createItems
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Item"
      responses:
        "200":
          description: ok
  /items/raw-count:
    post:
      operationId: setRawCount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: integer
      responses:
        "200":
          description: ok
  /items/{id}/patch:
    put:
      operationId: replaceItem
      description: A required body that may be null, as GitHub's gists/update has it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, nullable: true, properties: { name: { type: string } } }
      responses:
        "204":
          description: replaced
  /items/{id}/note:
    put:
      operationId: setNote
      description: A required body of any JSON that may be null.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { nullable: true }
      responses:
        "204":
          description: set
components:
  schemas:
    Item:
      type: object
      required: [name]
      properties:
        name:
          type: string
        quantity:
          type: integer
