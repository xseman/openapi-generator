openapi: "3.0.0"
info:
  title: Dates Feature
  version: 1.0.0
paths:
  /events:
    get:
      operationId: listEvents
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: onDay
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
    post:
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Event"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
  /today:
    get:
      operationId: getToday
      responses:
        "200":
          description: a day
          content:
            application/json:
              schema:
                type: string
                format: date
  /ticks:
    get:
      operationId: listTicks
      responses:
        "200":
          description: instants
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: date-time
  /day:
    put:
      operationId: putDay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              format: date
      responses:
        "204":
          description: stored
  /holidays:
    put:
      operationId: putHolidays
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                format: date
      responses:
        "204":
          description: stored
components:
  schemas:
    Event:
      type: object
      required: [startDate, createdAt]
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
        reminderDates:
          type: array
          items:
            type: string
            format: date
        reminderTimestamps:
          type: array
          items:
            type: string
            format: date-time
        seenBy:
          type: object
          additionalProperties:
            type: string
            format: date-time
