openapi: "3.0.0"
info:
  title: OneOf Discriminator Feature
  version: 1.0.0
paths:
  /pets:
    get:
      operationId: getPet
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
components:
  schemas:
    # two mapping values name the same model
    Pet:
      oneOf:
        - $ref: "#/components/schemas/Cat"
        - $ref: "#/components/schemas/Dog"
      discriminator:
        propertyName: petType
        mapping:
          cat: "#/components/schemas/Cat"
          dog: "#/components/schemas/Dog"
          canine: "#/components/schemas/Dog"
    Cat:
      type: object
      required: [petType]
      properties:
        petType:
          type: string
        huntingSkill:
          type: string
    Dog:
      type: object
      required: [petType]
      properties:
        petType:
          type: string
        packSize:
          type: integer
