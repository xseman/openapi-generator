openapi: "3.0.0"
info:
  title: Form URL Encoded Request Body Feature
  version: 1.0.0
paths:
  /login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                rememberMe:
                  type: boolean
                tags:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: ok
  /avatar:
    post:
      operationId: uploadAvatar
      description: A form declared url-encoded that holds a file, as FastAPI writes a form model with an UploadFile.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [user, image]
              properties:
                user:
                  type: string
                image:
                  type: string
                  format: binary
      responses:
        "204":
          description: stored
