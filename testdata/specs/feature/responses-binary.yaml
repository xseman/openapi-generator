openapi: "3.0.0"
info:
  title: Binary Response Feature
  version: 1.0.0
paths:
  /files/{id}/download:
    get:
      operationId: downloadFile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: binary file contents
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /files/{id}/thumbnail:
    get:
      operationId: getThumbnail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: image bytes
          content:
            image/png:
              schema:
                type: string
                format: binary
