openapi: "3.0.0"
info:
  title: API Key Security Feature
  version: 1.0.0
paths:
  /secure/header:
    get:
      operationId: getWithHeaderKey
      security:
        - HeaderKey: []
      responses:
        "200":
          description: ok
  /secure/query:
    get:
      operationId: getWithQueryKey
      security:
        - QueryKey: []
      responses:
        "200":
          description: ok
  /secure/cookie:
    get:
      operationId: getWithCookieKey
      security:
        - CookieKey: []
      responses:
        "200":
          description: ok
components:
  securitySchemes:
    HeaderKey:
      type: apiKey
      in: header
      name: X-Api-Key
    QueryKey:
      type: apiKey
      in: query
      name: api_key
    CookieKey:
      type: apiKey
      in: cookie
      name: session
