openapi: "3.0.0"
info:
  title: Runtime Name Clash Feature
  version: 1.0.0
  description: Models, operations and parameters named like the client runtime's own types and methods.
paths:
  /responses:
    post:
      operationId: request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Response"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
  /apis:
    get:
      operationId: fetchApi
      parameters:
        - { name: request, in: query, schema: { type: string } }
        - { name: buildUri, in: query, schema: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseAPI"
components:
  schemas:
    Response:
      type: object
      required: [status-code]
      properties:
        status-code:
          type: integer
    BaseAPI:
      type: object
      properties:
        base-path:
          type: string
